[package]
name = "spe"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "3.1.17", features = ["derive"] }
common = { path = "../common" }
ctrlc = "3.4"
walkdir = "2.3"
colored = "2.0"
regex = "1.7"
crossterm = "0.27"
parser = { path = "../parser" }
rand = "0.8"
ast = { path = "../ast" }
taint = { path = "../taint" }
harness-types = { path = "../harness-types" }
serde_json = "1.0"
strum = { version = "0.24.0", features = ["derive"] }
fuse = { path = "../fuse" }
generator = { path = "../generator" }

[dependencies.time]
version = "0.3.9"
features = ["formatting", "local-offset"]